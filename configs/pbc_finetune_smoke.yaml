# Finetune smoke：从 pretrain ckpt 接着微调，看 val AUC/KS
train_samples: data/pbc/processed/train.jsonl
val_samples:   data/pbc/processed/val.jsonl
cat_vocab:     data/pbc/processed/cat_vocab.json
init_from_pretrain: tmp/pbc_pretrain_smoke/encoder_state.pt

output_dir: tmp/pbc_finetune_smoke

epochs: 5
batch_size: 8
lr: 5.0e-5
weight_decay: 0.01
pos_weight: 4.0

d: 128
n_heads: 4
n_layers: 2
dropout: 0.1

num_workers: 0
log_every: 5
eval_per_epoch_steps: 10
seed: 42
