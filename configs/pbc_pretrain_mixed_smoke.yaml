# PBC 预训练 mixed smoke：base + diverse 报告混合
pretrain_samples:
  - data/pbc/processed/train_mixed.jsonl
val_samples: data/pbc/processed/val_mixed.jsonl
cat_vocab: data/pbc/processed/cat_vocab.json

# === PbcModelArguments ===
d: 128
n_heads: 4
n_layers: 2
dropout: 0.1
mask_ratio: 0.15
ema_decay: 0.9
mask_seed: 12345

# === TrainingArguments ===
output_dir: tmp/pbc_pretrain_mixed_smoke

num_train_epochs: 2
per_device_train_batch_size: 4   # 多样化数据有 N=400+ 的样本，batch 调小
per_device_eval_batch_size: 4
learning_rate: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.05

logging_steps: 10
logging_first_step: true

eval_strategy: steps
eval_steps: 30
save_strategy: steps
save_steps: 30
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_total
greater_is_better: false

remove_unused_columns: false
report_to: []
seed: 42
