# PBC 微调（HF Trainer）— 接 pretrain best_encoder.pt
# 多卡启动：torchrun --nproc_per_node=N run_pbc_finetune.py configs/pbc_finetune.yaml

# === PbcFinetuneModelArguments ===
d: 256
n_heads: 8
n_layers: 4
top_hidden: 512
dropout: 0.1
init_from_pretrain: output/pbc_pretrained/encoder_state.pt
pos_weight: 4.0

# === PbcDataArguments ===
train_samples: data/pbc/processed/train.jsonl
val_samples: data/pbc/processed/val.jsonl
cat_vocab: data/pbc/processed/cat_vocab.json

# === TrainingArguments ===
output_dir: output/pbc_finetuned

num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.1

logging_steps: 20
logging_first_step: true

eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_auc
greater_is_better: true

remove_unused_columns: false
report_to: []
seed: 42
