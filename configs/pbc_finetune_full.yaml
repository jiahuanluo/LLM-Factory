# PBC 微调全量：接 pretrain_full ckpt
train_samples: data/pbc/processed/train.jsonl
val_samples: data/pbc/processed/val.jsonl
cat_vocab: data/pbc/processed/cat_vocab.json

# === PbcFinetuneModelArguments ===
d: 256
n_heads: 8
n_layers: 4
top_hidden: 512
dropout: 0.1
init_from_pretrain: tmp/pbc_pretrain_full/encoder_state.pt
pos_weight: 4.0

# === TrainingArguments ===
output_dir: tmp/pbc_finetune_full

num_train_epochs: 10
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.1

logging_steps: 20
logging_first_step: true

eval_strategy: steps
eval_steps: 30
save_strategy: steps
save_steps: 30
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_auc
greater_is_better: true

remove_unused_columns: false
report_to: []
seed: 42
