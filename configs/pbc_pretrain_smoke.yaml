# PBC 预训练 smoke：少量 step 看 loss + val
pretrain_samples:
  - data/pbc/processed/train_mock.jsonl
val_samples: data/pbc/processed/val_mock.jsonl
cat_vocab: data/pbc/processed/cat_vocab_mock.json

# === PbcModelArguments ===
d: 128
n_heads: 4
n_layers: 2
dropout: 0.1
mask_ratio: 0.15
ema_decay: 0.9   # smoke 阶段较快追踪
mask_seed: 12345

# === TrainingArguments ===
output_dir: tmp/pbc_pretrain_smoke_mock   # 全新目录，避免旧格式 ckpt 自动恢复

num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
learning_rate: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.05

logging_steps: 5
logging_first_step: true

eval_strategy: steps
eval_steps: 15
save_strategy: steps
save_steps: 15
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_total
greater_is_better: false

remove_unused_columns: false
report_to: []
seed: 42
