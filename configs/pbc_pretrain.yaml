# PBC 预训练（HF Trainer）— 标准训练配置
# 多卡启动：torchrun --nproc_per_node=N run_pbc_pretrain.py configs/pbc_pretrain.yaml

# === PbcModelArguments ===
d: 256
n_heads: 8
n_layers: 4
top_hidden: 512
dropout: 0.1
mask_ratio: 0.15
ema_decay: 0.99
mask_seed: 12345

# === PbcDataArguments ===
pretrain_samples:
  - data/pbc/processed/train.jsonl
val_samples: data/pbc/processed/val.jsonl
cat_vocab: data/pbc/processed/cat_vocab.json

# === TrainingArguments ===
output_dir: output/pbc_pretrained

num_train_epochs: 2
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
learning_rate: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.05

logging_steps: 20
logging_first_step: true

eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_total
greater_is_better: false

remove_unused_columns: false
report_to: []
seed: 42
